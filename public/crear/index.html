<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creador de propuestas · REMAKE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EFE8; --bg-alt:#E8E4DA; --ink:#0A0A0A; --ink-soft:#1A1A1A; --ink-mute:#6B6B6B;
  --line:rgba(10,10,10,.12); --accent:#F64A00; --blue:#18336E; --card:#fff;
  --grad:linear-gradient(118deg,#18336E 0%,#3A46A0 34%,#F64A00 78%,#E5C29B 100%);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Fraunces',serif;font-style:italic}
a{color:inherit}
/* header */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 20px;background:rgba(242,239,232,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand .dot{width:26px;height:6px;border-radius:6px;background:var(--grad);display:inline-block}
.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--ink-mute);letter-spacing:.02em;margin-top:1px}
.appbar .hint{font-size:.72rem;color:var(--ink-mute)}
/* layout */
.wrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:0;height:calc(100vh - 59px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
.form{overflow-y:auto;padding:18px 20px 80px;border-right:1px solid var(--line)}
.preview{display:flex;flex-direction:column;background:var(--bg-alt);min-height:60vh}
@media(max-width:900px){.preview{height:80vh}}
/* form bits */
.row{margin-bottom:12px}
.row.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:5px}
label .mut{font-weight:400;color:var(--ink-mute)}
input,select,textarea{width:100%;font-family:inherit;font-size:.86rem;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:52px;line-height:1.4}
.presetbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:.74rem;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
details[open]{box-shadow:0 1px 0 var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;user-select:none}
summary::-webkit-details-marker{display:none}
summary .beat{font-family:'Fraunces',serif;font-style:italic;color:var(--accent);font-size:.95rem;min-width:20px}
summary .caret{margin-left:auto;color:var(--ink-mute);font-size:.8rem;transition:transform .2s}
details[open] summary .caret{transform:rotate(90deg)}
.sw{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .track{width:34px;height:19px;border-radius:99px;background:#cfc9bd;transition:.2s;display:inline-block;position:relative}
.sw .track::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked + .track{background:var(--accent)}
.sw input:checked + .track::after{transform:translateX(15px)}
.body{padding:2px 14px 14px}
.hlp{font-size:.7rem;color:var(--ink-mute);line-height:1.45;margin:2px 0 12px}
.hlp.warn{color:#9a4a1e;background:#f8e6da;border-radius:8px;padding:7px 9px}
.rep{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;position:relative;background:var(--bg)}
.rep .del{position:absolute;top:7px;right:7px;border:none;background:transparent;color:var(--ink-mute);cursor:pointer;font-size:1rem;line-height:1}
.rep .del:hover{color:var(--accent)}
.addbtn{font-size:.76rem;font-weight:600;color:var(--accent);background:transparent;border:1px dashed var(--accent);border-radius:8px;padding:7px 11px;cursor:pointer}
.addbtn:hover{background:#f8e6da}
.mini{font-size:.68rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin:14px 0 8px}
/* preview */
.pvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.btn{font-family:inherit;font-size:.8rem;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.pvbar .path{margin-left:auto;font-size:.72rem;color:var(--ink-mute);font-family:'Space Grotesk';white-space:nowrap}
.pvbar .path code{color:var(--ink);font-weight:600}
.frame{flex:1;position:relative;background:#fff}
iframe{width:100%;height:100%;border:0;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;font-size:.82rem;padding:11px 18px;border-radius:99px;z-index:50;transition:.25s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.two3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.logohint{display:flex;align-items:center;gap:10px}
.logohint img{height:34px;width:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
/* servicio cards */
.servcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.servcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;transition:.15s}
.servcard:hover{border-color:var(--accent)}
.servcard.on{background:var(--ink);border-color:var(--ink)}
.servcard b{font-size:.98rem;font-weight:700}
.servcard span{font-size:.66rem;color:var(--ink-mute);line-height:1.2}
.servcard.on b,.servcard.on span{color:#fff}
.servcard.on span{color:rgba(255,255,255,.7)}
@media(max-width:420px){.servcards{grid-template-columns:1fr}}
/* biblioteca */
.libbox{border-color:rgba(246,74,0,.3)}
.librow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.librow:last-of-type{border-bottom:none}
.librow b{font-size:.86rem}
.libacts{display:flex;gap:4px;flex-shrink:0}
.libacts .addbtn{padding:5px 9px}
/* selector de imágenes por rubro */
.imgpick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.imgthumb{position:relative;height:54px;border-radius:9px;border:2px solid var(--line);background-size:cover;background-position:center;background-color:var(--bg-alt);cursor:pointer;transition:.15s;padding:0}
.imgthumb:hover{border-color:var(--accent)}
.imgthumb.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(246,74,0,.25)}
.imgthumb span{position:absolute;top:4px;right:5px;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:800}
/* ajustes avanzados */
.adv{margin-top:14px;border-color:rgba(120,120,130,.28)}
.adv > summary{font-size:.82rem;color:var(--ink-mute)}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand"><span>REMAKE</span><span class="dot"></span>
    <span>Creador de propuestas<small>La fórmula de 8 beats, en minutos · no en horas</small></span>
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="hint">Se guarda solo en este navegador</span>
    <a class="btn ghost" href="https://remake-ai-web.vercel.app/casa-central" style="text-decoration:none;padding:8px 13px">← Casa Central</a>
  </div>
</div>

<div class="wrap">
  <section class="form" id="form"></section>
  <section class="preview">
    <div class="pvbar">
      <button class="btn primary" id="dl">⬇ Descargar</button>
      <button class="btn" id="save">📁 Guardar en carpeta</button>
      <button class="btn ghost" id="open">↗ Abrir</button>
      <button class="btn ghost" id="copy">⧉ Copiar</button>
      <button class="btn ghost" id="enviar">📲 Enviar</button>
      <span class="path">→ <code id="pathTxt">public/&lt;slug&gt;/index.html</code></span>
    </div>
    <div class="frame"><iframe id="pv" title="Vista previa"></iframe></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CREADOR DE PROPUESTAS — REMAKE
   Sistema visual: clon de la propuesta de AMI
   Estructura: la FÓRMULA de 8 beats aprobada (El Consejo, 9 jul 2026)
   1 Resultado · 2 Porqué · 3 Prueba · 4 Oferta · 5 Desglose(bot+web+cantidades)
   · 6 Pauta+benchmark · 7 Precio anclado · 8 Cierre
   ============================================================ */

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pad(n){return String(n).padStart(2,'0');}
function enc(s){return encodeURIComponent(String(s==null?'':s));}
function slugify(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'cliente';}
function debounce(fn,ms){let t;return function(){clearTimeout(t);t=setTimeout(fn,ms);};}

/* title line model: [{t:'...', accent:'...'}] -> line-mask spans, delays from startD */
function heads(lines,startD){
  return lines.map(function(ln,i){
    return '<span class="line-mask"><span data-d="'+(startD+i)+'">'+esc(ln.t)+
      (ln.accent?'<span class="accent">'+esc(ln.accent)+'</span>':'')+'</span></span>';
  }).join('');
}

/* ============================================================
   NICHOS — vocabulario + defaults por nicho
   ============================================================ */
const NICHOS={
  clinica:{label:'Clínica / salud',cf:'pacientes',cf1:'un paciente',pt:'sede',pts:'sedes',ev:'cita',evs:'citas',acc:'agendar',
    hero:'https://images.unsplash.com/photo-1598256989800-fe5f95da9787?w=1400&q=80&fm=jpg&fit=crop',
    cierre:'https://images.pexels.com/photos/3845810/pexels-photo-3845810.jpeg?auto=compress&cs=tinysrgb&w=1400'},
  estetica:{label:'Estética / spa',cf:'clientes',cf1:'un cliente',pt:'sede',pts:'sedes',ev:'cita',evs:'citas',acc:'agendar',
    hero:'https://images.unsplash.com/photo-1560750588-73207b1ef5b8?w=1400&q=80&fm=jpg&fit=crop',
    cierre:'https://images.unsplash.com/photo-1522337660859-02fbefca4702?w=1400&q=80&fm=jpg&fit=crop'},
  abogado:{label:'Abogado / legal',cf:'clientes',cf1:'un cliente',pt:'oficina',pts:'oficinas',ev:'consulta',evs:'consultas',acc:'agendar',
    hero:'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=1400&q=80&fm=jpg&fit=crop',
    cierre:'https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1400&q=80&fm=jpg&fit=crop'},
  restaurante:{label:'Restaurante / comida',cf:'clientes',cf1:'un cliente',pt:'punto',pts:'puntos',ev:'reserva',evs:'reservas',acc:'reservar',
    hero:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1400&q=80&fm=jpg&fit=crop',
    cierre:'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1400&q=80&fm=jpg&fit=crop'},
  servicios:{label:'Servicios (taller, hogar…)',cf:'clientes',cf1:'un cliente',pt:'punto',pts:'puntos',ev:'cita',evs:'citas',acc:'agendar',
    hero:'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1400&q=80&fm=jpg&fit=crop',
    cierre:'https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=1400&q=80&fm=jpg&fit=crop'},
  generico:{label:'Genérico',cf:'clientes',cf1:'un cliente',pt:'punto',pts:'puntos',ev:'cita',evs:'citas',acc:'agendar',
    hero:'https://images.unsplash.com/photo-1552664730-d307ca884978?w=1400&q=80&fm=jpg&fit=crop',
    cierre:'https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=1400&q=80&fm=jpg&fit=crop'}
};
const MONEDAS={COP:'COP',CAD:'CAD',USD:'USD'};

/* ============================================================
   BANCO DE IMÁGENES POR CATEGORÍA (respaldo, se usan solas)
   3 opciones hero + 3 cierre por rubro. Todas verificadas (200).
   Se elige la [0] por defecto; el selector permite cambiarlas.
   ============================================================ */
function imgURL(id,w){ return 'https://images.unsplash.com/photo-'+id+'?w='+(w||1400)+'&q=80&fm=jpg&fit=crop'; }
const IMG={
  clinica:{hero:['1598256989800-fe5f95da9787','1629909613654-28e377c37b09','1588776814546-1ffcf47267a5'],
           cierre:['1588776814546-1ffcf47267a5','1629909613654-28e377c37b09','1598256989800-fe5f95da9787']},
  estetica:{hero:['1560750588-73207b1ef5b8','1570172619644-dfd03ed5d881','1522337660859-02fbefca4702'],
            cierre:['1522337660859-02fbefca4702','1570172619644-dfd03ed5d881','1560750588-73207b1ef5b8']},
  abogado:{hero:['1589829545856-d10d557cf95f','1505664194779-8beaceb93744','1450101499163-c8848c66ca85'],
           cierre:['1521791136064-7986c2920216','1450101499163-c8848c66ca85','1505664194779-8beaceb93744']},
  restaurante:{hero:['1517248135467-4c7edcad34c4','1552566626-52f8b828add9','1414235077428-338989a2e8c0'],
               cierre:['1414235077428-338989a2e8c0','1466978913421-dad2ebd01d17','1517248135467-4c7edcad34c4']},
  servicios:{hero:['1581091226825-a6a2a5aee158','1600880292203-757bb62b4baf','1497366216548-37526070297c'],
             cierre:['1600880292203-757bb62b4baf','1521737604893-d14cc237f11d','1581091226825-a6a2a5aee158']},
  generico:{hero:['1552664730-d307ca884978','1556740738-b6a63e27c4df','1497215728101-856f4ea42174'],
            cierre:['1521737604893-d14cc237f11d','1497215728101-856f4ea42174','1552664730-d307ca884978']}
};
function imgSet(nichoKey){ return IMG[nichoKey]||IMG.generico; }

/* ============================================================
   SERVICIOS — los 3 que vende REMAKE. Cada uno auto-configura
   qué beats se muestran + el precio por moneda + qué incluye.
   ============================================================ */
const SERVICIOS={
  make:{label:'Make',tag:'Solo el asistente',desc:'Atiende y agenda 24/7 por WhatsApp. El bot que no deja caer un mensaje.',
    beats:{reto:true,prueba:true,always:true,motivo:true,bot:true,demo:true,pack:false,pauta:false,precio:true},
    precio:{COP:'$1.200.000',CAD:'$497',USD:'$400'},
    incluye:['Asistente que atiende y {acc}a 24/7','Detecta urgencias y las prioriza','Agenda sobre tu calendario, con tus reglas','Todo revisado a mano por nuestro equipo humano']},
  makers:{label:'Makers',tag:'Atrae + atiende',desc:'El asistente + redes, contenido y pauta para traer {cf} nuevos. El sistema completo.',
    beats:{reto:true,prueba:true,always:true,motivo:true,bot:true,demo:true,pack:true,pauta:true,precio:true},
    precio:{COP:'$2.900.000',CAD:'$1.297',USD:'$1.000'},
    incluye:['Asistente que atiende y {acc}a 24/7','Redes + contenido al mes + pauta gestionada','Tu web al día · reporte y reunión cada mes','Todo revisado a mano por nuestro equipo humano']},
  remake:{label:'Remake',tag:'A la medida',desc:'Todo lo de Makers + lo que tu negocio necesite. Hecho a tu medida.',
    beats:{reto:true,prueba:true,always:true,motivo:true,bot:true,demo:true,pack:true,pauta:true,precio:true},
    precio:{COP:'Cotización',CAD:'desde $2.597',USD:'desde $2.000'},
    incluye:['Todo lo de Makers, a tu medida','Integraciones y flujos propios para tu negocio','Acompañamiento dedicado de nuestro equipo','Todo montado y operado por nosotros']}
};

/* ============================================================
   PROMOS — el regalo/gancho que le das al cliente (1 clic).
   ============================================================ */
const PROMOS={
  web:        {label:'Web gratis',        h3:'Tu web nueva',              pill:'Gratis',          p:'Rediseñada y lista para tu negocio. Va de regalo.',              anchor:true},
  descuento:  {label:'Descuento',         h3:'Descuento de lanzamiento',  pill:'50% × 6 meses',   p:'Arrancas a mitad de precio los primeros 6 meses, sin riesgo.',   anchor:false},
  instalacion:{label:'Instalación gratis',h3:'Instalación gratis',        pill:'Sin costo',       p:'Montamos todo el sistema sin cobrarte la puesta en marcha.',     anchor:false},
  mesprueba:  {label:'Mes de prueba',     h3:'Un mes de prueba',          pill:'Para verlo',      p:'Lo ves funcionando un mes completo y lo afinamos. Estamos detrás.',anchor:false},
  equipo:     {label:'Equipo humano',     h3:'Nuestro equipo detrás',     pill:'Siempre',         p:'No es un bot suelto: personas reales lo montan, lo cuidan y lo arreglan.',anchor:false}
};

/* ============================================================
   DEFAULTS — construye el modelo completo para un nicho
   Copy fuerte y honesto (voz REMAKE: tú, humanos primero, sin "chatbot")
   ============================================================ */
function mkDefaults(nichoKey,cliente,contacto,moneda){
  var v=NICHOS[nichoKey]||NICHOS.generico;
  cliente=cliente||'Nuevo cliente'; contacto=contacto||'Hola';
  var C=cliente, cf=v.cf, cf1=v.cf1, pt=v.pt, pts=v.pts, ev=v.ev, evs=v.evs, acc=v.acc;
  var stem=acc.replace(/ar$/,''); /* agendar->agenda · reservar->reserva (conjugación) */
  var cfSing=cf.replace(/s$/,''); /* pacientes->paciente */
  var sym=moneda==='COP'?'$':'$';
  return {
    slug:slugify(cliente), cliente:cliente, contacto:contacto, nicho:nichoKey, moneda:moneda||'COP', logo:'',
    servicio:'makers', promos:['web','mesprueba'], descuentoTexto:'50% × 6 meses',
    whatsapp:'15875854143', email:'mateo.corredor@helloremake.com',
    firma:'Mateo Corredor', rol:'REMAKE · Un equipo que cuida a tus '+cf,

    /* 1 · RESULTADO (portada) — fusiona beat 1 + emoción del beat 2 */
    cover:{
      l1:contacto+' —',
      l2:'Te traemos '+cf+' nuevos y atendemos a cada uno — montado y operado por nosotros.',
      titulo:[{t:'Atendemos y '+stem+'amos'},{t:'a cada '+cfSing+' de '+C+' —'},{t:'en tus '+pts+','},{t:'',accent:'a toda hora.'}],
      cta:'Trabajemos juntos ↓',
      heroPhoto:imgURL(imgSet(nichoKey).hero[0]),
      chat:[{who:'them',t:'Buenas… necesito '+(acc==='reservar'?'una '+ev:'una '+ev)+' 🙌 ¿me ayudan?'},
            {who:'us',t:'Claro que sí, te ayudo enseguida. ¿Cuál '+pt+' te queda mejor? Tengo espacio mañana a primera hora ✨'}],
      chatTime:'2:14 a.m. · domingo · cerrado'
    },

    /* 2 · PORQUÉ / EL RETO — el dolor + la emoción */
    reto:{on:true,
      titulo:[{t:'Varios '+pts+'. '+C.split(' ')[0]},{t:'con '+cf+' escribiendo a ',accent:'toda hora.'}],
      sub:'Los mensajes entran todo el día — y también cuando ya cerraron. Cada uno sin responder a tiempo es una '+ev+' que se puede perder.',
      puntos:[
        {loc:pt.charAt(0).toUpperCase()+pt.slice(1)+' 01',name:'Punto 1',pain:'Preguntan por una '+ev+' mientras la recepción está ocupada. El mensaje espera.'},
        {loc:pt.charAt(0).toUpperCase()+pt.slice(1)+' 02',name:'Punto 2',pain:'Escriben a las 8 p.m. para mover su '+ev+'. Nadie contesta hasta mañana.'},
        {loc:pt.charAt(0).toUpperCase()+pt.slice(1)+' 03',name:'Punto 3',pain:'Sin respuesta rápida, se van con la competencia que sí contestó.'}
      ],
      foot:'Cada mensaje sin respuesta a tiempo = una '+ev+' que se puede perder.'
    },

    /* 3 · PRUEBA (datos reales, dark) */
    prueba:{on:true,

/* ============================================================
   APLICAR SERVICIO / PROMO / REHACER  (la magia de "pocos clics")
   ============================================================ */
function applyServicio(M,key){
  var s=SERVICIOS[key]; if(!s) return;
  M.servicio=key;
  var b=s.beats;
  ['reto','prueba','always','motivo','bot','demo','pack','pauta','precio'].forEach(function(k){ if(M[k]) M[k].on=b[k]; });
  var v=NICHOS[M.nicho]||NICHOS.generico, stem=v.acc.replace(/ar$/,'');
  var price=s.precio[M.moneda]||s.precio.COP, custom=/cotiz|desde/i.test(price);
  M.oferta.feat.price=price;
  M.oferta.feat.unit=custom?'':(M.moneda+' / mes');
  M.oferta.feat.tag=(key==='remake')?'A la medida':(key==='make'?'El asistente':'Todo incluido');
  M.oferta.feat.h3=(key==='make')?'Tu asistente 24/7':(key==='remake'?'Tu sistema a la medida':'Tu marketing + tu asistente');
  M.oferta.feat.list=s.incluye.map(function(x){return x.replace('{acc}',stem).replace('{cf}',v.cf);});
  var fc=M.precio.cards[M.precio.cards.length-1]; if(fc){ fc.price=price; fc.small=custom?'':'/mes'; }
}
/* devuelve el objeto de la promo; el descuento usa el monto que puso Mateo */
function promoObj(M,k){
  if(k==='descuento'){ var d=(M.descuentoTexto||'50% × 6 meses');
    return {label:'Descuento',h3:'Descuento de lanzamiento',pill:d,p:'Aplicamos '+d+' sobre el precio, para que arranques sin riesgo.',anchor:false}; }
  return PROMOS[k];
}
/* MULTI-select: recibe un arreglo de keys de PROMOS */
function applyPromos(M,arr){
  arr=(arr&&arr.length)?arr.filter(function(k){return PROMOS[k];}):[];
  M.promos=arr;
  var sel=arr.map(function(k){return promoObj(M,k);});
  var soft1={h3:'Todo montado por nosotros',pill:'Llave en mano',p:'Nosotros lo instalamos, lo operamos y lo cuidamos.'};
  var soft2={h3:'Nuestro equipo detrás',pill:'Siempre',p:'Personas reales revisando y ajustando. No te toca nada técnico.'};
  M.oferta.regalo1= sel[0]?{h3:sel[0].h3,pill:sel[0].pill,p:sel[0].p}:soft1;
  M.oferta.regalo2= sel[1]?{h3:sel[1].h3,pill:sel[1].pill,p:sel[1].p}:soft2;
  var hasAnchor=sel.some(function(x){return x.anchor;});
  if(hasAnchor){ if(!M.oferta.feat.anchor) M.oferta.feat.anchor='Contratarlo por separado: mucho más'; }
  else M.oferta.feat.anchor='';
  var names=arr.map(function(k){var o=promoObj(M,k);return k==='descuento'?('descuento '+o.pill):o.label.toLowerCase();});
  M.oferta.note=(names.length?('De regalo: '+names.join(', ')+'. '):'')+'Nuestro equipo humano lo revisa y lo ajusta.';
}
/* compat: 1 sola promo */
function applyPromo(M,key){ applyPromos(M,[key]); }
/* rehace el copy para el rubro actual y reaplica servicio + promo (preserva identidad) */
function rebake(){
  var k={cliente:M.cliente,contacto:M.contacto,moneda:M.moneda,logo:M.logo,whatsapp:M.whatsapp,email:M.email,firma:M.firma,servicio:M.servicio,promos:M.promos};
  M=mkDefaults(M.nicho,k.cliente,k.contacto,k.moneda);
  M.logo=k.logo; M.whatsapp=k.whatsapp; M.email=k.email; M.firma=k.firma;
  applyServicio(M,k.servicio||'makers'); applyPromos(M,(k.promos&&k.promos.length)?k.promos:['web','mesprueba']);
}

/* ============================================================
   BIBLIOTECA "Mis propuestas" (localStorage) — las vamos guardando
   ============================================================ */
var LIBK='remake_creador_lib_v1';
function libLoad(){ try{ return JSON.parse(localStorage.getItem(LIBK))||[]; }catch(e){ return []; } }
function libSave(a){ try{ localStorage.setItem(LIBK,JSON.stringify(a)); }catch(e){} }
function libUpsert(){
  var a=libLoad(), slug=M.slug||slugify(M.cliente);
  var fecha; try{ fecha=new Date().toISOString().slice(0,10); }catch(e){ fecha=''; }
  var rec={id:slug,cliente:M.cliente,servicio:M.servicio,promos:M.promos,nicho:M.nicho,fecha:fecha,model:JSON.parse(JSON.stringify(M))};
  var i=-1; a.forEach(function(x,idx){ if(x.id===slug)i=idx; });
  if(i>=0)a[i]=rec; else a.unshift(rec);
  libSave(a);
}
function libDelete(id){ libSave(libLoad().filter(function(x){return x.id!==id;})); }
function libGet(id){ var r=null; libLoad().forEach(function(x){ if(x.id===id)r=x; }); return r; }

@media (max-width:768px){.vs-card{border-right:none;min-height:auto;padding:1.6rem 0;}}
.vs-card:hover{background:var(--bg-alt);}
.vs-card.featured{background:var(--ink);color:var(--cream);}
.vs-card.featured:hover{background:var(--ink);}
.vs-label{font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;}
.vs-card.featured .vs-label{color:rgba(255,255,255,0.62);}
.vs-price{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.03em;font-size:clamp(1.75rem,3vw,2.4rem);line-height:1;color:var(--ink);}
.vs-card.featured .vs-price{color:#fff;}
.vs-price small{font-size:0.4em;font-weight:500;letter-spacing:0.03em;color:var(--ink-mute);}
.vs-card.featured .vs-price small{color:rgba(255,255,255,0.6);}
.vs-bar{height:8px;border-radius:8px;background:var(--bg-alt);overflow:hidden;margin:0.35rem 0;}
.vs-card.featured .vs-bar{background:rgba(255,255,255,0.15);}
.vs-bar i{display:block;height:100%;border-radius:8px;background:var(--ink-mute);}
.vs-card.featured .vs-bar i{background:var(--grad-bright);}
.vs-note{font-size:0.85rem;color:var(--ink-mute);line-height:1.5;margin-top:auto;}
.vs-card.featured .vs-note{color:rgba(255,255,255,0.8);}
.vs-note b{color:var(--ink);font-weight:600;}
.vs-card.featured .vs-note b{color:#fff;}
.vs-foot{font-size:0.78rem;color:var(--ink-mute);line-height:1.5;}
.scroll-progress{position:fixed;top:0;left:0;height:3px;background:var(--grad);z-index:200;transition:width 0.1s linear;width:0%;}
.mobile-nav{display:none;}
@media (max-width:768px){.mobile-nav{display:flex;position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:100;gap:0.5rem;background:rgba(242,239,232,0.96);backdrop-filter:blur(16px);border:1px solid rgba(10,10,10,0.08);padding:0.4rem 0.5rem;border-radius:100px;box-shadow:0 4px 30px rgba(0,0,0,0.06);}body.dark-active .mobile-nav{background:rgba(20,20,20,0.96);border-color:rgba(255,255,255,0.1);}.mobile-nav button{border:none;background:transparent;width:36px;height:36px;cursor:pointer;color:var(--ink);font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;border-radius:50%;}body.dark-active .mobile-nav button{color:var(--cream);}.mobile-nav .progress-text{font-size:0.7rem;color:var(--ink-mute);padding:0 0.5rem;display:flex;align-items:center;font-variant-numeric:tabular-nums;letter-spacing:0.1em;font-weight:500;}body.dark-active .mobile-nav .progress-text{color:rgba(255,255,255,0.55);}}
@media (min-width:769px) and (max-height:820px){.slide{padding-top:4.75rem;padding-bottom:2.5rem;}.sede{min-height:160px;padding-top:1.4rem;padding-bottom:1.4rem;}.gift{min-height:200px;padding-top:1.7rem;padding-bottom:1.7rem;}.reto{gap:1.6rem;}.flow,.always,.oferta,.prueba,.demo,.vs{gap:1.5rem;}.head-sub{margin-top:0.7rem;}.head h2{font-size:clamp(1.9rem,4vw,3rem);}.bignum .n{font-size:clamp(3.6rem,9vw,7.5rem);}.phone{height:clamp(330px,54vh,450px);}.demo-vals{margin-top:1rem;gap:0.45rem;}.vs-card{min-height:170px;padding-top:1.5rem;padding-bottom:1.5rem;}}
`;

const PROP_JS = `
const slides=document.querySelectorAll('.slide');
const navNum=document.getElementById('navNum');
const mNum=document.getElementById('mNum');
const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',function(e){if(cursor){cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';}});
document.querySelectorAll('a,button,.sede,.node,.gift,.weekend-card,.bignum,.chat-card,.cierre-action,.cta-btn,.pack-item,.vs-card').forEach(function(el){el.addEventListener('mouseenter',function(){cursor&&cursor.classList.add('expand');});el.addEventListener('mouseleave',function(){cursor&&cursor.classList.remove('expand');});});
const scrollProgress=document.getElementById('scrollProgress');
window.addEventListener('scroll',function(){var total=document.body.scrollHeight-window.innerHeight;var pct=(window.scrollY/total)*100;if(scrollProgress)scrollProgress.style.width=pct+'%';});
const observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting&&entry.intersectionRatio>0.3){var idx=Array.from(slides).indexOf(entry.target);slides.forEach(function(s){s.classList.remove('active');});entry.target.classList.add('active');var numStr=String(idx+1).padStart(2,'0');if(navNum)navNum.textContent=numStr;if(mNum)mNum.textContent=numStr;if(entry.target.classList.contains('slide-dark')){document.body.classList.add('dark-active');}else{document.body.classList.remove('dark-active');}}});},{threshold:[0.3,0.4,0.5,0.6,0.7]});
slides.forEach(function(slide){observer.observe(slide);});
window.addEventListener('load',function(){if(slides[0])slides[0].classList.add('active');});
document.addEventListener('keydown',function(e){var current=document.querySelector('.slide.active');var idx=Array.from(slides).indexOf(current);if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(idx<slides.length-1)slides[idx+1].scrollIntoView({behavior:'smooth'});}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(idx>0)slides[idx-1].scrollIntoView({behavior:'smooth'});}});
var mp=document.getElementById('mPrev');if(mp)mp.addEventListener('click',function(){var current=document.querySelector('.slide.active');var idx=Array.from(slides).indexOf(current);if(idx>0)slides[idx-1].scrollIntoView({behavior:'smooth'});});
var mn=document.getElementById('mNext');if(mn)mn.addEventListener('click',function(){var current=document.querySelector('.slide.active');var idx=Array.from(slides).indexOf(current);if(idx<slides.length-1)slides[idx+1].scrollIntoView({behavior:'smooth'});});
`;

const SPLASH_JS=`(function(){
  var s=document.getElementById('splash'),g=document.getElementById('spGreet'),c=document.getElementById('spCount');if(!s)return;
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var L=(((navigator.language||'es').slice(0,2)==='en')?'en':'es');
  var lbl=(L==='en')?'Loading':'Cargando';
  var words=['Hola','Hello','Bonjour','Ol\\u00e1','\\u4f60\\u597d'];
  var wi=0,ci=0,del=false,stopped=false;
  function tw(){ if(stopped)return; var wd=words[wi%words.length];
    if(!del){ci++;g.textContent=wd.slice(0,ci);if(ci>=wd.length){del=true;setTimeout(tw,430);return;}}
    else{ci--;g.textContent=wd.slice(0,ci);if(ci<=0){del=false;wi++;setTimeout(tw,140);return;}}
    setTimeout(tw,del?28:55);
  }
  if(reduce){ if(g)g.textContent=words[0]; } else { tw(); }
  var DUR=1900,t0=null,ready=false,done=false,tStart=Date.now(),MINH=1900,MAXH=4200;
  function finish(){ if(done)return;done=true;stopped=true; if(c)c.textContent=lbl+' 100%'; s.classList.add('hide');setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s);},650);}
  function maybeHide(){ if(done)return; if(ready && (Date.now()-tStart)>=MINH){ finish(); } }
  function mark(){ ready=true; maybeHide(); }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(mark);}
  window.addEventListener('load',mark);
  setTimeout(mark,3000); setTimeout(maybeHide,MINH); setTimeout(finish,MAXH);
  function step(ts){ if(done)return; if(t0==null)t0=ts;
    var p=(ts-t0)/DUR, pct=Math.floor(p*100);
    if(pct>99)pct=ready?100:99; if(pct<0)pct=0;
    if(c)c.textContent=lbl+' '+pct+'%';
    if(pct<100||!ready){ requestAnimationFrame(step); }
  }
  requestAnimationFrame(step);
})();`;

function buildProposal(M){
  var C=M.cliente;
  var slides=[];
  slides.push({fn:slidePortada,dark:false});
  if(M.reto.on)   slides.push({fn:slideReto});
  if(M.prueba.on) slides.push({fn:slidePrueba});
  if(M.always.on) slides.push({fn:slideAlways});
  if(M.motivo.on) slides.push({fn:slideMotivo});
  slides.push({fn:slideOferta});
  if(M.bot.on)    slides.push({fn:slideBot});
  if(M.demo.on)   slides.push({fn:slideDemo});
  if(M.pack.on)   slides.push({fn:slidePack});
  if(M.pauta.on)  slides.push({fn:slidePauta});
  if(M.precio.on) slides.push({fn:slidePrecio});
  slides.push({fn:slideCierre});
  var total=slides.length;
  var body=slides.map(function(s,i){return s.fn(M,i+1,total);}).join('\n');

  var av=iniciales(C);
  var navmark=M.logo?'<span class="ami-navmark"><img src="'+M.logo+'" alt="'+esc(C)+'"></span> ':'';
  var nav='<div class="top-nav"><div class="nav-logo">'+RMK_LOGO+'<span class="grad-dot"></span>'+navmark+
    '<span style="opacity:0.5;font-weight:400">para '+esc(C)+'</span></div>'+
    '<div class="nav-meta"><span id="navNum">01</span> / '+pad(total)+'</div></div>';
  var mobnav='<div class="mobile-nav"><button id="mPrev">←</button><div class="progress-text"><span id="mNum">01</span> / '+pad(total)+'</div><button id="mNext">→</button></div>';

  var chatInject='';
  if(M.demo.on){
    chatInject='var chatScript='+JSON.stringify(M.demo.script).replace(/</g,'\\u003c')+';\n'+CHAT_JS;
  }
  var closeScript='<'+'/script>';

  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">\n'+

    '<style>'+PROP_CSS+SPLASH_CSS+'</style>\n</head>\n<body>\n'+
    SPLASH_HTML+'\n'+

    nav+'\n'+mobnav+'\n'+body+'\n<script>\n'+SPLASH_JS+'\n'+PROP_JS+'\n'+chatInject+'\n'+closeScript+'\n</body>\n</html>';

/* set por ruta con puntos (soporta arreglos por índice: reto.puntos.0.name) */
function setPath(path,val){
  var ks=path.split('.'), o=M;
  for(var i=0;i<ks.length-1;i++){ o=o[ks[i]]; }
  o[ks[ks.length-1]]=val;
}
function getPath(path){ var ks=path.split('.'), o=M; for(var i=0;i<ks.length;i++){ if(o==null)return ''; o=o[ks[i]]; } return o==null?'':o; }

/* ============================================================

   ============================================================ */
function inp(path,label,ph){ return '<div class="row"><label>'+label+'</label><input data-k="'+path+'" value="'+esc(getPath(path))+'" placeholder="'+(ph||'')+'"></div>'; }
function txt(path,label,ph){ return '<div class="row"><label>'+label+'</label><textarea data-k="'+path+'" placeholder="'+(ph||'')+'">'+esc(getPath(path))+'</textarea></div>'; }
function titleInputs(path,label){
  var arr=getPath(path)||[];
  var rows=arr.map(function(ln,i){
    return '<div class="rep"><button class="del" data-act="delline" data-path="'+path+'" data-i="'+i+'">×</button>'+
      '<div class="row"><label>Línea '+(i+1)+' <span class="mut">· texto normal</span></label><input data-k="'+path+'.'+i+'.t" value="'+esc(ln.t)+'"></div>'+

  }).join('');
  return '<div class="mini">'+label+'</div>'+rows+'<button class="addbtn" data-act="addline" data-path="'+path+'">+ Línea</button>';
}
function sw(path){ return '<span class="sw"><input type="checkbox" data-k="'+path+'"'+(getPath(path)?' checked':'')+'><span class="track"></span></span>'; }
function beat(num,name,key,inner,alwaysOn){
  var toggle=alwaysOn?'<span class="mini" style="margin:0;color:var(--accent)">fijo</span>':sw(key+'.on');
  var open=(alwaysOn||getPath(key+'.on'))?' open':'';
  return '<details'+open+'><summary><span class="beat">'+num+'</span> '+name+'<span class="caret">▸</span>'+
    '<span onclick="event.stopPropagation()" style="margin-left:6px">'+toggle+'</span></summary><div class="body">'+inner+'</div></details>';
}

function repeater(arrPath,rows,addLabel){
  var arr=getPath(arrPath)||[];
  var html=arr.map(function(item,i){ return '<div class="rep"><button class="del" data-act="delitem" data-path="'+arrPath+'" data-i="'+i+'">×</button>'+rows(item,i)+'</div>'; }).join('');
  return html+'<button class="addbtn" data-act="additem" data-path="'+arrPath+'">+ '+addLabel+'</button>';
}

    titleInputs('motivo.titulo','Titular motivo')+
    '<div class="row"><label>Tags <span class="mut">(separa con coma)</span></label><input data-k="__tags" value="'+esc((M.motivo.tags||[]).join(', '))+'"></div>'+
    txt('motivo.p','Texto')+txt('motivo.honesty','Nota de honestidad');
  h+=beat('3c','Prueba · para qué escriben','motivo',b3c);

  /* BEAT 4 — Oferta */
  var b4=titleInputs('oferta.titulo','Titular de la oferta')+
    '<div class="mini">Regalo 1</div>'+inp('oferta.regalo1.h3','Título')+inp('oferta.regalo1.pill','Pastilla')+txt('oferta.regalo1.p','Texto')+
    '<div class="mini">Tarjeta central (el paquete)</div>'+inp('oferta.feat.tag','Etiqueta')+inp('oferta.feat.h3','Título')+inp('oferta.feat.anchor','Ancla (tachado)')+
    '<div class="row two"><div><label>Precio</label><input data-k="oferta.feat.price" value="'+esc(M.oferta.feat.price)+'"></div><div><label>Unidad</label><input data-k="oferta.feat.unit" value="'+esc(M.oferta.feat.unit)+'"></div></div>'+
    inp('oferta.feat.note','Nota bajo precio')+
    '<div class="row"><label>Lista de incluidos <span class="mut">(una por línea)</span></label><textarea data-k="__featlist">'+esc((M.oferta.feat.list||[]).join('\n'))+'</textarea></div>'+
    '<div class="mini">Regalo 2</div>'+inp('oferta.regalo2.h3','Título')+inp('oferta.regalo2.pill','Pastilla')+txt('oferta.regalo2.p','Texto')+
    txt('oferta.note','Nota pie de oferta')+inp('oferta.ctaText','Texto del botón');
  h+=beat('4','La oferta','oferta',b4,true);

  /* BEAT 5 — Desglose */
  var b5bot=titleInputs('bot.titulo','Titular del bot')+txt('bot.sub','Subtítulo')+
    '<div class="mini">Nodo 1 (entra)</div>'+inp('bot.n1.k','Kicker')+inp('bot.n1.t','Título')+txt('bot.n1.d','Descripción')+
    '<div class="mini">Nodo central (cerebro)</div>'+inp('bot.central.k','Kicker')+inp('bot.central.t','Título')+txt('bot.central.d','Descripción')+
    '<div class="mini">Nodo 3 (agenda)</div>'+inp('bot.n3.k','Kicker')+inp('bot.n3.t','Título')+
    '<div class="row"><label>Mini-lista '+NICHOS[M.nicho].pts+' <span class="mut">(coma)</span></label><input data-k="__botmini" value="'+esc((M.bot.n3.mini||[]).join(', '))+'"></div>'+
    txt('bot.n3.d','Descripción')+txt('bot.foot','Frase de cierre');
  h+=beat('5','Desglose · el bot','bot',b5bot);

  var b5demo=titleInputs('demo.titulo','Titular demo')+txt('demo.sub','Subtítulo')+
    '<div class="row"><label>Valores <span class="mut">(una por línea)</span></label><textarea data-k="__demovals">'+esc((M.demo.vals||[]).join('\n'))+'</textarea></div>'+
    '<div class="mini">Conversación (se anima en bucle)</div>'+
    repeater('demo.script',function(it,i){return '<div class="row"><label>Quién</label><select data-k="demo.script.'+i+'.who"><option value="them"'+(it.who==='them'?' selected':'')+'>Cliente</option><option value="us"'+(it.who==='us'?' selected':'')+'>Asistente</option></select></div><div class="row"><label>Mensaje</label><textarea data-k="demo.script.'+i+'.t">'+esc(it.t)+'</textarea></div>';},'Mensaje');
  h+=beat('5b','Desglose · demo en vivo','demo',b5demo);

  var b5pack=titleInputs('pack.titulo','Titular del paquete')+txt('pack.sub','Subtítulo')+
    '<div class="mini">Items del paquete</div>'+
    repeater('pack.items',function(it,i){return '<div class="row two"><div><label>Cantidad <span class="mut">(o vacío)</span></label><input data-k="pack.items.'+i+'.qty" value="'+esc(it.qty||'')+'"></div><div><label>Etiqueta</label><input data-k="pack.items.'+i+'.tag" value="'+esc(it.tag||'')+'"></div></div>'+inp('pack.items.'+i+'.h3','Título')+txt('pack.items.'+i+'.p','Texto')+'<div class="row"><label class="sw" style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" data-k="pack.items.'+i+'.opt"'+(it.opt?' checked':'')+'><span class="track"></span> Opcional (punteado)</label></div>';},'Item')+
    txt('pack.foot','Frase de cierre');
  h+=beat('5c','Desglose · cantidades','pack',b5pack);

  /* BEAT 6 — Pauta + benchmark */
  var b6=titleInputs('pauta.titulo','Titular de la pauta')+txt('pauta.sub','Subtítulo')+
    '<div class="mini">2 opciones de inversión</div>'+
    repeater('pauta.opciones',function(it,i){return inp('pauta.opciones.'+i+'.tag','Etiqueta')+inp('pauta.opciones.'+i+'.monto','Monto/mes')+inp('pauta.opciones.'+i+'.h3','Título')+txt('pauta.opciones.'+i+'.p','Texto + estimado');},'Opción')+
    txt('pauta.foot','Nota de honestidad (sin ROAS prometido)');
  h+=beat('6','Pauta + benchmark','pauta',b6);

  /* BEAT 7 — Precio anclado */
  var b7=titleInputs('precio.titulo','Titular del precio')+txt('precio.sub','Subtítulo')+
    '<div class="mini">3 tarjetas comparativas (la última destacada)</div>'+
    repeater('precio.cards',function(it,i){return inp('precio.cards.'+i+'.label','Etiqueta')+'<div class="row two"><div><label>Precio</label><input data-k="precio.cards.'+i+'.price" value="'+esc(it.price)+'"></div><div><label>Small</label><input data-k="precio.cards.'+i+'.small" value="'+esc(it.small)+'"></div></div>'+'<div class="row two"><div><label>Barra %</label><input data-k="precio.cards.'+i+'.barPct" value="'+esc(it.barPct)+'"></div><div><label class="sw" style="display:inline-flex;gap:8px;align-items:center;margin-top:22px"><input type="checkbox" data-k="precio.cards.'+i+'.featured"'+(it.featured?' checked':'')+'><span class="track"></span> Destacada</label></div></div>'+txt('precio.cards.'+i+'.note','Nota');},'Tarjeta')+
    txt('precio.foot','Nota pie');
  h+=beat('7','Precio anclado','precio',b7);

  /* BEAT 8 — Cierre */
  var b8=inp('cierre.greeting','Saludo')+titleInputs('cierre.titulo','Titular del cierre')+
    txt('cierre.message','Mensaje')+txt('cierre.quote','Cita sobre la foto')+inp('cierre.cierrePhoto','Foto cierre (URL)');
  h+=beat('8','Cierre','cierre',b8,true);
  h+='</div></details>'; /* cierra Ajustes avanzados */

  document.getElementById('form').innerHTML=h;
}

/* ============================================================
   BINDING + PREVIEW
   ============================================================ */
var pv=document.getElementById('pv');
function updatePreview(){
  M.slug=slugify(M.slug||M.cliente);
  document.getElementById('pathTxt').textContent='public/'+M.slug+'/index.html';
  try{ pv.srcdoc=buildProposal(M); }catch(e){ pv.srcdoc='<pre style="padding:20px;font:13px monospace;color:#b00">'+esc(e.message)+'</pre>'; }
  save();
}
var schedulePreview=debounce(updatePreview,220);

/* campos "virtuales" que necesitan parseo (listas) */
function applyVirtual(k,val){
  if(k==='__nichosel'){ M.nicho=val; rebake(); renderForm(); updatePreview(); return true; }
  if(k==='__monsel'){ M.moneda=val; applyServicio(M,M.servicio); renderForm(); updatePreview(); return true; }
  if(k==='__tags'){ M.motivo.tags=val.split(',').map(function(s){return s.trim();}).filter(Boolean); return true; }
  if(k==='__featlist'){ M.oferta.feat.list=val.split('\n').map(function(s){return s.trim();}).filter(Boolean); return true; }
  if(k==='__demovals'){ M.demo.vals=val.split('\n').map(function(s){return s.trim();}).filter(Boolean); return true; }
  if(k==='__botmini'){ M.bot.n3.mini=val.split(',').map(function(s){return s.trim();}).filter(Boolean); return true; }
  return false;
}

document.getElementById('form').addEventListener('input',function(e){
  var t=e.target, k=t.getAttribute('data-k');
  if(!k) return;
  var val=(t.type==='checkbox')?t.checked:t.value;
  if(applyVirtual(k,val)){ schedulePreview(); return; }
  setPath(k,val);
  if(k==='descuentoTexto'){ applyPromos(M,M.promos); } /* recalcula la oferta con el nuevo monto */
  /* si cambió un on/off de sección, re-render para mostrar/ocultar (solo en change) */
  schedulePreview();
});
document.getElementById('form').addEventListener('change',function(e){
  var t=e.target, k=t.getAttribute('data-k');
  if(k && t.type==='checkbox' && /\.on$/.test(k)){ updatePreview(); }
  if(k==='moneda'){ /* nada extra */ }
});

document.getElementById('form').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act');
  if(act==='servicio'){ applyServicio(M,b.getAttribute('data-v')); renderForm(); updatePreview(); toast('Servicio: '+SERVICIOS[M.servicio].label); return; }
  if(act==='promo'){ var pk=b.getAttribute('data-v'), arr=(M.promos||[]).slice(), ix=arr.indexOf(pk); if(ix>-1)arr.splice(ix,1); else arr.push(pk); applyPromos(M,arr); renderForm(); updatePreview(); return; }
  if(act==='img'){ var ii=+b.getAttribute('data-i'), st=imgSet(M.nicho); M.cover.heroPhoto=imgURL(st.hero[ii]); M.cierre.cierrePhoto=imgURL(st.cierre[ii]); renderForm(); updatePreview(); return; }
  if(act==='rebake'){ rebake(); renderForm(); updatePreview(); toast('Copy rehecho para '+NICHOS[M.nicho].label+' ✨'); return; }
  if(act==='nueva'){ M=mkDefaults('clinica','Nuevo cliente','Hola',M.moneda); applyServicio(M,'makers'); applyPromos(M,['web','mesprueba']); renderForm(); updatePreview(); toast('Propuesta nueva en blanco'); return; }
  if(act==='libopen'){ var lr=libGet(b.getAttribute('data-id')); if(lr){ M=lr.model; renderForm(); updatePreview(); toast('Abierta: '+lr.cliente); } return; }
  if(act==='libdl'){ var lr2=libGet(b.getAttribute('data-id')); if(lr2){ downloadModel(lr2.model); } return; }
  if(act==='libdel'){ libDelete(b.getAttribute('data-id')); renderForm(); toast('Propuesta borrada'); return; }
  if(act==='nicho'){ M.nicho=b.getAttribute('data-v'); renderForm(); updatePreview(); return; }
  if(act==='fill'){
    var keep={cliente:M.cliente,contacto:M.contacto,moneda:M.moneda,logo:M.logo,whatsapp:M.whatsapp,email:M.email,firma:M.firma};
    M=mkDefaults(M.nicho,keep.cliente,keep.contacto,keep.moneda);
    M.logo=keep.logo; M.whatsapp=keep.whatsapp; M.email=keep.email; M.firma=keep.firma;
    renderForm(); updatePreview(); toast('Plantilla de '+NICHOS[M.nicho].label+' cargada ✨'); return;
  }
  if(act==='size'){
    var big=b.getAttribute('data-v')==='completa';
    M.reto.on=big; M.always.on=big; M.motivo.on=big; M.bot.on=big; M.demo.on=big; M.pauta.on=big;
    M.prueba.on=true; M.pack.on=true; M.precio.on=true;
    renderForm(); updatePreview(); toast(big?'Propuesta completa':'Propuesta compacta (5 beats)'); return;
  }
  if(act==='dellogo'){ M.logo=''; renderForm(); updatePreview(); return; }
  if(act==='additem'){ var p=getPath(b.getAttribute('data-path')); p.push(cloneLast(p)); renderForm(); updatePreview(); return; }
  if(act==='delitem'){ var arr=getPath(b.getAttribute('data-path')); arr.splice(+b.getAttribute('data-i'),1); renderForm(); updatePreview(); return; }
  if(act==='addline'){ var l=getPath(b.getAttribute('data-path')); l.push({t:'Nueva línea',accent:''}); renderForm(); updatePreview(); return; }
  if(act==='delline'){ var la=getPath(b.getAttribute('data-path')); la.splice(+b.getAttribute('data-i'),1); renderForm(); updatePreview(); return; }
});
document.getElementById('form').addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-act')==='logo' && t.files && t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){ M.logo=fr.result; renderForm(); updatePreview(); };
    fr.readAsDataURL(t.files[0]);
  }
});
function cloneLast(arr){
  var last=arr[arr.length-1];
  if(!last) return {};
  var c=JSON.parse(JSON.stringify(last));
  /* limpia textos para que no dupliquen idéntico */
  return c;
}

/* ============================================================
   ACCIONES: descargar / copiar / abrir / guardar en carpeta
   ============================================================ */
function downloadHTML(html){
  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='index.html';
  document.body.appendChild(a); a.click(); a.remove();
}
function download(){
  downloadHTML(buildProposal(M)); libUpsert(); renderForm();
  toast('Descargado + guardado en Mis propuestas. Ponlo en public/'+M.slug+'/index.html');
}
function downloadModel(m){ downloadHTML(buildProposal(m)); toast('Descargada: '+m.cliente+' → public/'+m.slug+'/'); }
function mensajeEnvio(){
  var url='https://remake-propuestas.vercel.app/'+M.slug;
  var quien=(M.firma||'Mateo').split(' ')[0];
  var promos=(M.promos||[]).map(function(k){return promoObj(M,k).label.toLowerCase();});
  var regalos=promos.length?(' Le metí de regalo '+promos.slice(0,2).join(' y ')+'.'):'';
  return 'Hola '+(M.contacto||'')+' 🙌 Te dejo lista la propuesta para '+M.cliente+', como quedamos.\n\n'+
    'Adentro está todo clarito: qué incluye, cómo se ve funcionando y las opciones para arrancar.'+regalos+' Ábrela con calma, también se ve bien desde el celu 👇\n\n'+
    url+'\n\nCualquier cosa me dices y arrancamos cuando quieras.\n— '+quien+', REMAKE';
}
function enviar(){
  libUpsert(); renderForm();
  window.open('https://wa.me/?text='+enc(mensajeEnvio()),'_blank');
  toast('Abriendo WhatsApp con el mensaje listo. (Publica la propuesta antes para que el link abra.)');
}
function copy(){
  var html=buildProposal(M);
  if(navigator.clipboard){ navigator.clipboard.writeText(html).then(function(){toast('HTML copiado ⧉');},function(){toast('No pude copiar');}); }
  else{ toast('Copia no soportada aquí'); }
}
function openTab(){
  var html=buildProposal(M);
  var blob=new Blob([html],{type:'text/html'});
  window.open(URL.createObjectURL(blob),'_blank');
}
async function saveToFolder(){
  if(!window.showDirectoryPicker){ toast('Tu navegador no soporta guardar directo — usa Descargar'); download(); return; }
  try{
    var dir=await window.showDirectoryPicker({mode:'readwrite'});
    var sub=await dir.getDirectoryHandle(M.slug,{create:true});
    var fh=await sub.getFileHandle('index.html',{create:true});
    var w=await fh.createWritable(); await w.write(buildProposal(M)); await w.close();
    libUpsert(); renderForm();
    toast('Guardado en '+M.slug+'/index.html ✅ — haz commit y push');
  }catch(e){ if(e.name!=='AbortError') toast('No se pudo guardar: '+e.message); }
}
document.getElementById('dl').addEventListener('click',download);
document.getElementById('copy').addEventListener('click',copy);
document.getElementById('open').addEventListener('click',openTab);
document.getElementById('save').addEventListener('click',saveToFolder);
document.getElementById('enviar').addEventListener('click',enviar);

var toastEl=document.getElementById('toast'), toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('show');},3200); }

/* ---------- init ---------- */
renderForm();
updatePreview();
</script>
</body>
</html>
